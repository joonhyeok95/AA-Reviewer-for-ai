spring:
  application:
    name: board-service
  profiles:
    default: local
  datasource:
    url: jdbc:h2:mem:board;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

---
# 로컬/테스트 환경: Config Server, Eureka 없이 단독 기동
spring:
  config:
    activate:
      on-profile: local
  cloud:
    config:
      enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
eureka:
  client:
    enabled: false

---
# 클라우드 환경: Config Server에서 설정을 받고 Eureka에 등록
spring:
  config:
    activate:
      on-profile: cloud
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: true
      fail-fast: true
eureka:
  client:
    enabled: true
