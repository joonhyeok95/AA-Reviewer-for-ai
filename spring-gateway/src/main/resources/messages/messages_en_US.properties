# Gateway messages (en_US)
G0001.title=No route
G0001.content=No service is mapped to the requested path.
G0002.title=Service unavailable
G0002.content=The service is temporarily unavailable. Please try again later.
G0003.title=Gateway timeout
G0003.content=The service did not respond in time. Please try again later.
G0004.title=Service suspended
G0004.content=Requests are temporarily blocked due to a service failure. Please try again later.
G0005.title=Too many requests
G0005.content=Too many requests. Please try again later.
G0006.title=Invalid request path
G0006.content=The request path format is not allowed.
E0001.title=System error
E0001.content=A temporary error occurred. Please try again later.
