# ============================================================
# 테스트 전용 override (src/main/resources/application-local.yml 위에 덮어씀)
#  - 테스트 클래스마다 Spring Context 가 다를 수 있으므로 Context 별로 독립된 H2 DB 를 사용한다.
#    (같은 DB 를 공유하면 DDL 스크립트가 두 번 실행되어 "already exists" 오류 발생)
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:test-${random.uuid};MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
  h2:
    console:
      enabled: false

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
