# ============================================================
# 메시지 정의 (en_US)
#  - Key 규칙 : {messageId}.title / {messageId}.content
#  - 치환 인자 : {0}, {1} ... (MessageFormat). 작은따옴표는 '' 로 표기
#  - ID 규칙   : S(성공) / C(공통 요청 오류) / B(비즈니스 오류) / E(시스템 오류) + 4자리
# ============================================================

# ---------- 성공 ----------
S0000.title=Success
S0000.content=The request was processed successfully.
S0001.title=Retrieved
S0001.content=Retrieved successfully.
S0002.title=List retrieved
S0002.content={0} item(s) retrieved.
S0003.title=Created
S0003.content=Created successfully.
S0004.title=Updated
S0004.content=Updated successfully.
S0005.title=Deleted
S0005.content=Deleted successfully.

# ---------- 공통 요청 오류 ----------
C0001.title=Bad request
C0001.content=The request is invalid.
C0002.title=Invalid input
C0002.content=Some input values are invalid. Please check the fields.
C0003.title=Invalid format
C0003.content=The format of [{0}] is invalid.
C0004.title=Missing parameter
C0004.content=Required parameter [{0}] is missing.
C0005.title=Unreadable body
C0005.content=The request body could not be read. Please check the JSON format.
C0006.title=Method not supported
C0006.content=The HTTP method is not supported.
C0007.title=Media type not supported
C0007.content=The Content-Type is not supported.
C0008.title=Not found
C0008.content=The requested path was not found.
C0009.title=Unauthorized
C0009.content=Authentication is required.
C0010.title=Forbidden
C0010.content=You do not have permission for this request.

# ---------- 비즈니스 오류 ----------
B0001.title=Not found
B0001.content=The requested data could not be found.
B0002.title=Duplicate
B0002.content=The data already exists.
B0003.title=Data error
B0003.content=The request violates a data constraint.

# ---------- Domain errors (B1xxx, B2xxx ... per domain) ----------
# [sample] B1001 ~ B1999
B1001.title=Sample not found
B1001.content=The sample could not be found. (ID: {0})
B1002.title=Duplicate sample name
B1002.content=The sample name already exists. ({0})

# ---------- 시스템 오류 ----------
E0001.title=System error
E0001.content=A temporary error occurred. Please try again later.
