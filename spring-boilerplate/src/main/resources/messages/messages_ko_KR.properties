# ============================================================
# 메시지 정의 (ko_KR)
#  - Key 규칙 : {messageId}.title / {messageId}.content
#  - 치환 인자 : {0}, {1} ... (MessageFormat). 작은따옴표는 '' 로 표기
#  - ID 규칙   : S(성공) / C(공통 요청 오류) / B(비즈니스 오류) / E(시스템 오류) + 4자리
# ============================================================

# ---------- 성공 ----------
S0000.title=처리 완료
S0000.content=정상 처리되었습니다.
S0001.title=조회 완료
S0001.content=조회되었습니다.
S0002.title=목록 조회 완료
S0002.content={0}건 조회되었습니다.
S0003.title=등록 완료
S0003.content=등록되었습니다.
S0004.title=수정 완료
S0004.content=수정되었습니다.
S0005.title=삭제 완료
S0005.content=삭제되었습니다.

# ---------- 공통 요청 오류 ----------
C0001.title=잘못된 요청
C0001.content=요청이 올바르지 않습니다.
C0002.title=입력값 오류
C0002.content=입력값이 올바르지 않습니다. 입력 항목을 확인해 주세요.
C0003.title=입력값 형식 오류
C0003.content=[{0}] 항목의 형식이 올바르지 않습니다.
C0004.title=필수값 누락
C0004.content=필수 항목 [{0}]이(가) 누락되었습니다.
C0005.title=요청 본문 오류
C0005.content=요청 본문을 읽을 수 없습니다. JSON 형식을 확인해 주세요.
C0006.title=지원하지 않는 요청
C0006.content=지원하지 않는 HTTP Method 입니다.
C0007.title=지원하지 않는 형식
C0007.content=지원하지 않는 Content-Type 입니다.
C0008.title=요청 경로 없음
C0008.content=요청한 경로를 찾을 수 없습니다.
C0009.title=인증 필요
C0009.content=인증이 필요합니다.
C0010.title=권한 없음
C0010.content=해당 요청에 대한 권한이 없습니다.

# ---------- 비즈니스 오류 ----------
B0001.title=데이터 없음
B0001.content=요청한 데이터를 찾을 수 없습니다.
B0002.title=중복 데이터
B0002.content=이미 존재하는 데이터입니다.
B0003.title=데이터 처리 오류
B0003.content=데이터 제약조건에 위배되어 처리할 수 없습니다.

# ---------- 업무 도메인 오류 (도메인별 B1xxx, B2xxx ... 범위 할당) ----------
# [sample] B1001 ~ B1999
B1001.title=샘플 없음
B1001.content=샘플 정보를 찾을 수 없습니다. (ID: {0})
B1002.title=샘플명 중복
B1002.content=이미 존재하는 샘플명입니다. ({0})

# ---------- 시스템 오류 ----------
E0001.title=시스템 오류
E0001.content=일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
