# ============================================================
# prod : Oracle
#  - 접속 정보는 환경변수로 주입: DB_URL, DB_USERNAME, DB_PASSWORD
#  - 운영에서는 Swagger UI / API Docs 비활성화
# ============================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.flowlog.backend: INFO

# 기동 시 https(IdP URL) / Secure 쿠키 / 운영 시크릿 여부 검사 (SecurityStartupValidator)
app:
  security:
    require-https: true

server:
  servlet:
    session:
      cookie:
        secure: true
