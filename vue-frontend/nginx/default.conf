# ============================================================
# 운영 정적 웹서버 (vue-frontend dist)
#  - Gateway(9909) 의 web 라우트(WEB_SERVICE_URI)가 이 서버를 가리킨다. 브라우저는 Gateway 로만 접속
#  - /cm/** 는 Gateway 가 API 로 보내므로 여기로 오지 않는다
#  - SPA : 없는 경로는 index.html (Vue Router history 모드)
# ============================================================
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # 보안 헤더
  #  - style-src 'unsafe-inline' : 에디터(Tiptap/ProseMirror)·Vue 의 인라인 style 속성
  #  - frame-src https: : IFRAME 유형 메뉴 (외부 대시보드 등). 대상을 알면 도메인으로 좁힌다
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # 빌드 산출물(파일명에 해시) - 장기 캐시
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # index.html 은 캐시하지 않음 (배포 즉시 새 버전)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}
