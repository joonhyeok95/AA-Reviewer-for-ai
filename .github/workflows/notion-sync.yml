# 저장소 문서(원본) → 노션 페이지 자동 동기화
#  - main 에 spring-boilerplate/docs/** 가 바뀌면 바뀐 문서만 노션에 반영 (scripts/notion-sync/pages.json 매핑)
#  - 저장소 Secret NOTION_TOKEN (노션 내부 통합 토큰) 이 없으면 건너뛴다
#  - 노션 통합을 상위 페이지「spring-boilerplate (Flowlog Backend API)」에 연결해야 한다
name: notion-sync

on:
  push:
    branches: [main]
    paths:
      - 'spring-boilerplate/docs/**'
      - 'spring-boilerplate/scripts/notion-sync/**'
      - '.github/workflows/notion-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        if: env.NOTION_TOKEN != ''
        working-directory: spring-boilerplate/scripts/notion-sync
        run: npm install --no-audit --no-fund
      - name: Sync changed docs
        if: env.NOTION_TOKEN != ''
        working-directory: spring-boilerplate/scripts/notion-sync
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node sync.mjs
          else
            # 이번 push 에서 바뀐 문서만 (매핑에 없는 문서는 sync.mjs 가 건너뜀)
            CHANGED=$(git -C ../.. diff --relative --name-only HEAD~1 HEAD -- docs)
            if [ -n "$CHANGED" ]; then node sync.mjs $CHANGED; else node sync.mjs; fi
          fi
      - name: Skipped
        if: env.NOTION_TOKEN == ''
        run: echo "NOTION_TOKEN 이 없어 노션 동기화를 건너뜁니다."
