# spring-gateway CI : 빌드 + 전체 테스트
#  - 테스트는 Testcontainers 로 실제 Redis 를 띄운다 (ubuntu 러너에 Docker 기본 제공)
name: gateway-ci

on:
  push:
    branches: [main]
    paths: ['spring-gateway/**', '.github/workflows/gateway-ci.yml']
  pull_request:
    paths: ['spring-gateway/**', '.github/workflows/gateway-ci.yml']

permissions:
  contents: read

# 모노레포: 모든 run 단계는 spring-gateway/ 에서 실행
defaults:
  run:
    working-directory: spring-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: spring-gateway/pom.xml
      - name: Build & Test
        run: ./mvnw -B verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: spring-gateway/target/surefire-reports
          if-no-files-found: ignore
